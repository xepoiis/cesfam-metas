<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - CESFAM Santa Rosa</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .login-container h2 { color: #0056b3; margin-bottom: 5px; }
        .login-container p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s;}
        .btn-login:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>CESFAM Santa Rosa</h2>
        <p>Plataforma de Metas Sanitarias</p>
        
        <div class="form-group">
            <label>RUT del Funcionario</label>
            <input type="text" class="form-control" placeholder="Ej: 12.345.678-9" id="rut">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" class="form-control" placeholder="********" id="password">
        </div>
        <button class="btn-login" onclick="iniciarSesion()">Ingresar al Sistema</button>
    </div>

    <script>
        function iniciarSesion() {
            const rut = document.getElementById('rut').value;
            if(!rut) { alert("Error: Debe ingresar sus credenciales."); return; }
            alert("Validando JWT en backend... Acceso concedido.");
        }
    </script>
</body>
</html>
