<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carga REM</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; display: flex; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding-top: 20px; }
        .sidebar h3 { text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 15px; margin: 0; }
        .sidebar a { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; border-bottom: 1px solid #34495e; }
        .sidebar .active { background: #34495e; color: white; border-left: 4px solid #2ecc71; }
        .content { flex-grow: 1; padding: 40px; }
        .upload-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 700px; margin: 0 auto 30px; }
        .drop-zone { border: 3px dashed #3498db; border-radius: 10px; padding: 40px; text-align: center; color: #3498db; cursor: pointer; background: #ebf5fb; margin-bottom: 20px; }
        .btn-upload { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Subdirección</h3>
        <a href="#" class="active">Subir Planilla REM</a>
        <a href="#">Salir</a>
    </div>
    <div class="content">
        <div class="upload-card">
            <h2 style="margin-top:0; text-align:center;">Procesador de Archivos Excel (.xlsm)</h2>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <select id="mes" style="flex:1; padding:10px;"><option value="">Seleccione Mes Evaluado</option><option value="9">Septiembre</option></select>
                <select style="flex:1; padding:10px;"><option>2026</option></select>
            </div>
            <label class="drop-zone" id="drop-label">
                <span id="drop-text">Arrastre el archivo REM aquí o haga clic para buscar</span>
                <input type="file" style="display:none;" id="file" accept=".xlsm">
            </label>
            <button class="btn-upload" onclick="alert('Conectando con FastAPI (openpyxl)... Extrayendo celdas.')">Iniciar Extracción de Datos</button>
        </div>

        <h3 style="max-width: 700px; margin: 0 auto 10px;">Historial de Cargas Exitosas</h3>
        <table style="max-width: 700px; margin: 0 auto;">
            <tr style="background:#f2f2f2;"><th>Fecha Carga</th><th>Archivo</th><th>Mes Asignado</th><th>Usuario (RUT)</th></tr>
            <tr><td>2026-09-01 10:45</td><td>REM_A01_A04_SEP.xlsm</td><td>Septiembre</td><td>11.222.333-4</td></tr>
        </table>
    </div>
</body>
</html>
