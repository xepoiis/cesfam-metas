<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Parametrización - Gestor</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; display: flex; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding-top: 20px; }
        .sidebar h3 { text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 15px; margin: 0; }
        .sidebar a { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; border-bottom: 1px solid #34495e; }
        .sidebar .active { background: #34495e; color: white; border-left: 4px solid #9b59b6; }
        .content { flex-grow: 1; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .btn-save { padding: 10px 15px; background: #9b59b6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Gestor de Sistema</h3>
        <a href="gestor_parametros.html" class="active">Mapeo OOTT (Fórmulas)</a>
        <a href="gestor_usuarios.html">Gestión de Usuarios</a>
        <a href="gestor_auditoria.html">Logs de Auditoría</a>
    </div>
    <div class="content">
        <h2>Parametrización del Motor de Cálculo</h2>
        <div class="card" style="max-width: 600px;">
            <h3 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">1. Configurar Mapeo de Celda (Excel)</h3>
            <div class="form-group"><label>Variable OOTT</label><input type="text" placeholder="Ej: Var_Numerador_Meta1"></div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;"><label>Hoja (Ej: A03)</label><input type="text"></div>
                <div class="form-group" style="flex:1;"><label>Celda (Ej: J26)</label><input type="text"></div>
            </div>
            <button class="btn-save" onclick="alert('Mapeo guardado en base de datos. Se registrará en Auditoría.')">Guardar Coordenadas</button>
        </div>

        <div class="card" style="max-width: 600px;">
            <h3 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">2. Construcción de Fórmula Dinámica</h3>
            <div class="form-group">
                <label>Escriba la Fórmula Matemática</label>
                <input type="text" placeholder="Ej: (Var_Numerador_Meta1 / PIV_Cardio) * 100">
            </div>
            <button class="btn-save" style="background:#2980b9;" onclick="alert('Fórmula actualizada para el motor de evaluación.')">Actualizar Ecuación</button>
        </div>
    </div>
</body>
</html>
